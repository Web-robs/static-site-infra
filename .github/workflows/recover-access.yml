name: Recover SSH Access
on:
  workflow_dispatch:

jobs:
  add-access:
    runs-on: ubuntu-latest

    steps:
      - name: Add new SSH key to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            echo "ssh-rsa  robin@Robins-MacBook-Air.local" >> ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            echo "New SSH key added successfully."

