name: Deploy Vite Site to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps and build Vite app
        working-directory: ./site
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Remove old site files from EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            sudo rm -rf /home/ubuntu/site/*
            sudo mkdir -p /home/ubuntu/site
            sudo chown -R ubuntu:ubuntu /home/ubuntu/site

      - name: Upload built site (dist) to EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: "site/dist/*"
          target: "/home/ubuntu/site"

      - name: Reload NGINX
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            sudo systemctl reload nginx
